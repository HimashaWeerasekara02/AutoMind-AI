<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Garage - AutoMind AI</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { font-family: Inter, sans-serif; }
#toast { visibility:hidden; opacity:0; transition:0.4s }
#toast.show { visibility:visible; opacity:1 }
</style>
</head>

<body class="bg-gray-900 text-gray-300 p-8">

<!-- Toast -->
<div id="toast" class="fixed top-8 left-1/2 -translate-x-1/2 z-50">
  <div id="toast-content" class="bg-green-600 text-white px-6 py-3 rounded-lg">
    <span id="toast-message"></span>
  </div>
</div>

<div class="max-w-6xl mx-auto">

<h1 class="text-3xl font-bold text-white mb-6">My Garage</h1>

<button id="open-modal" class="bg-blue-600 px-4 py-2 rounded mb-6">
➕ Add Vehicle
</button>

<input id="garage-search"
 class="w-full mb-6 p-3 rounded bg-gray-800"
 placeholder="Search vehicle">

<div id="vehicle-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center">
<div class="bg-gray-800 p-6 rounded w-full max-w-md">

<form id="add-vehicle-form" class="space-y-3">

<input id="vehicle-nickname" class="w-full p-2 rounded bg-gray-700" placeholder="Nickname" required>
<input id="vehicle-make" class="w-full p-2 rounded bg-gray-700" placeholder="Make" required>
<input id="vehicle-model" class="w-full p-2 rounded bg-gray-700" placeholder="Model" required>
<input id="vehicle-year" type="number" class="w-full p-2 rounded bg-gray-700" placeholder="Year" required>
<input id="vehicle-plate" class="w-full p-2 rounded bg-gray-700" placeholder="Plate">

<div class="flex justify-end gap-3">
<button type="button" id="close-modal">Cancel</button>
<button class="bg-blue-600 px-4 py-2 rounded">Save</button>
</div>

</form>
</div>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const modal = document.getElementById("modal");
const list  = document.getElementById("vehicle-list");

document.getElementById("open-modal").onclick = () => modal.classList.remove("hidden");
document.getElementById("close-modal").onclick = () => modal.classList.add("hidden");

function toast(msg, err=false){
 const t=document.getElementById("toast");
 document.getElementById("toast-message").innerText=msg;
 document.getElementById("toast-content").className =
 err ? "bg-red-600 text-white px-6 py-3 rounded-lg"
     : "bg-green-600 text-white px-6 py-3 rounded-lg";
 t.classList.add("show");
 setTimeout(()=>t.classList.remove("show"),3000);
}

/* LOAD VEHICLES */
async function loadVehicles(){
 list.innerHTML="";
 const res = await fetch("get_vehicles.php");
 const data = await res.json();

 if(!data || Object.keys(data).length===0){
   list.innerHTML="<p>No vehicles found</p>";
   return;
 }

 for(const id in data){
   const v=data[id];
   list.innerHTML+=`
   <div class="bg-gray-800 p-4 rounded vehicle-card">
     <h3 class="text-xl text-white">${v.nickname}</h3>
     <p>${v.year} ${v.make} ${v.model}</p>
     <p class="text-sm">Plate: ${v.plate || "N/A"}</p>
   </div>`;
 }
}

/* ADD VEHICLE */
document.getElementById("add-vehicle-form").onsubmit = async e =>{
 e.preventDefault();

 const payload={
  nickname: document.getElementById("vehicle-nickname").value,
  make: document.getElementById("vehicle-make").value,
  model: document.getElementById("vehicle-model").value,
  year: document.getElementById("vehicle-year").value,
  plate: document.getElementById("vehicle-plate").value
 };

 const res = await fetch("add_vehicle.php",{
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify(payload)
 });

 const result = await res.json();
 if(!result.success) return toast(result.error,true);

 modal.classList.add("hidden");
 e.target.reset();
 toast("Vehicle added!");
 loadVehicles();
};

/* SEARCH */
document.getElementById("garage-search").oninput = e =>{
 const q=e.target.value.toLowerCase();
 document.querySelectorAll(".vehicle-card").forEach(c=>{
  c.style.display = c.innerText.toLowerCase().includes(q) ? "block":"none";
 });
};

loadVehicles();
});
</script>

</body>
</html>
